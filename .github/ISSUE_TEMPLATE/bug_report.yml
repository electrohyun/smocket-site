name: Bug report
description: Report a visual, interaction, accessibility, or demo issue
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: Route
      description: Where did this happen?
      placeholder: / or /demo?view=observer
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the shortest steps that reproduce the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport, and selected theme.
      placeholder: Chrome 140, macOS, 1440x900, dark
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Drag in a screenshot or recording when the issue is visual.
