name: Task
description: A unit of work on the landing page
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true

  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Concrete, checkable conditions for completion.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Context, links, or constraints. Optional.
